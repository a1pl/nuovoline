plugins {
    id 'java'
}

group = 'cc.nuovoline'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

def osName = System.getProperty('os.name').toLowerCase()
def lwjglVersion = '2.9.4-nightly-20150209'
def lwjglNatives = osName.contains('win') ? 'natives-windows' : (osName.contains('mac') ? 'natives-osx' : 'natives-linux')

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java', 'cc/**', 'net/**', 'me/**', 'ninja/**', 'viaversion/**'
        }
        resources {
            srcDirs = ['.']
            include 'assets/**', 'log4j2.xml'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'], excludes: ['lwjgl*.jar', 'lombok.jar'])

    implementation "org.lwjgl.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl.lwjgl:lwjgl_util:${lwjglVersion}"
    runtimeOnly "org.lwjgl.lwjgl:lwjgl-platform:${lwjglVersion}:${lwjglNatives}"

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
}

tasks.register('runClient', JavaExec) {
    group = 'nuovoline'
    mainClass = 'Start'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file('run')
    jvmArgs = ["-Djava.library.path=${file('natives')}"]

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// fat jar for launcher
tasks.register('launcherJar', Jar) {
    group = 'nuovoline'
    description = 'builds jjar for prism and stuff'
    archiveBaseName = 'nuovoline'
    archiveVersion = ''
    archiveClassifier = '1.8.8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'net.minecraft.client.main.Main',
                'Implementation-Title': 'Nuovoline',
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output

    // patches
    def runtimeJars = configurations.runtimeClasspath.filter {
        it.name.endsWith('.jar') &&
                !it.name.startsWith('lwjgl') &&
                it.name != 'lombok.jar'
    }
    def patchJars = runtimeJars.filter { it.name == 'netty-1.8.8.jar' }
    def otherJars = runtimeJars.filter { it.name != 'netty-1.8.8.jar' }

    from { patchJars.collect { zipTree(it) } }
    from { otherJars.collect { zipTree(it) } }

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
}
